# 文件用途：配置 DeepSeek 聊天模型、百炼/本地 Embedding、超时、重试和生成参数。
# 调用关系：config_handler.py 加载本文件；model/factory.py 用它创建模型客户端。
# 修改易踩坑：模型名称必须是供应商真实支持的值，Embedding更换后必须重建索引，密钥不写在这里。
chat_model_name: deepseek-v4-flash
embedding_model_name: text-embedding-v4
local_embedding_dimension: 1024
embedding_max_retries: 3
temperature: 0.1
# 小学问答以快速、稳定为主。开启思考模式会增加延迟和输出费用。
thinking_enabled: false
request_timeout: 60
max_retries: 2
